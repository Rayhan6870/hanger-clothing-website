kind = "web"
previewPath = "/"
title = "HANGER Clothing Store"
description = "A responsive storefront for HANGER, a Dhaka-based menswear brand, featuring real product photos, a persistent cart, delivery-aware checkout, and WhatsApp ordering."
version = "1.0.0"
id = "artifacts/hanger-storefront"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21487

[services.development]
run = "pnpm --filter @workspace/hanger-storefront run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hanger-storefront", "run", "build" ]
serve = "static"
publicDir = "artifacts/hanger-storefront/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21487"
BASE_PATH = "/"
